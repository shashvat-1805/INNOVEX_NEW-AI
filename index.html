<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>INNOVEX — Problem → Solution → Proof</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f7fb;--card:#fff;--ink:#14182b;--mut:#667;--line:#e2e5ef;--pri:#4f46e5;--ok:#0a8f5b;--bad:#c93a3a;--warn:#c27a00}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1220;--card:#181c30;--ink:#eceefa;--mut:#9aa0bd;--line:#2b3050;--pri:#8b84ff;--ok:#3ccf91;--bad:#ff7a7a;--warn:#f0b24a}}
:root[data-theme="dark"]{--bg:#0f1220;--card:#181c30;--ink:#eceefa;--mut:#9aa0bd;--line:#2b3050;--pri:#8b84ff;--ok:#3ccf91;--bad:#ff7a7a;--warn:#f0b24a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header b{font-size:18px;color:var(--pri);margin-right:8px}
nav button{background:none;border:0;color:var(--mut);padding:6px 10px;border-radius:8px;cursor:pointer;font:inherit}
nav button.on{background:var(--pri);color:#fff}
main{max-width:980px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
h2{margin:4px 0 12px;font-size:20px}h3{margin:0 0 8px;font-size:16px}
input,select,textarea{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;margin:4px 0 10px}
label{font-size:13px;color:var(--mut)}
.btn{background:var(--pri);color:#fff;border:0;padding:8px 14px;border-radius:8px;cursor:pointer;font:inherit}
.btn.alt{background:none;color:var(--pri);border:1px solid var(--pri)}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--bg);border:1px solid var(--line);margin:0 4px 4px 0;color:var(--mut)}
.steps{display:flex;gap:4px;margin:8px 0 14px;flex-wrap:wrap}.steps span{flex:1;min-width:70px;text-align:center;font-size:12px;padding:5px;border-radius:6px;background:var(--bg);color:var(--mut);border:1px solid var(--line)}
.steps .done{background:var(--ok);color:#fff;border-color:var(--ok)}.steps .cur{background:var(--pri);color:#fff;border-color:var(--pri)}
.bar{height:10px;background:var(--bg);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri)}
.big{font-size:28px;font-weight:700}.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}.mut{color:var(--mut);font-size:13px}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center}
.verified{border:2px solid var(--ok);background:var(--card)}
table{width:100%;border-collapse:collapse}td,th{padding:6px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}
</style></head><body>
<header><b>INNOVEX</b><nav id="nav"></nav><span style="flex:1"></span><span id="who" class="mut"></span><button class="btn alt" onclick="resetAll()">Reset demo</button></header>
<main id="app"></main>
<script>
const SECT=['Government','Corporate','Healthcare','University','Manufacturing','Agriculture','Logistics','Sustainability'];
const KPI={Government:'Turnaround time, cost per case, citizen satisfaction',Corporate:'Cycle time, cost per unit, error rate',Healthcare:'Wait time, cost per patient, error rate',University:'Process time, cost, user satisfaction',Manufacturing:'Throughput, defect rate, downtime',Agriculture:'Yield, input cost, wastage',Logistics:'Processing time, cost per order, error rate',Sustainability:'Emissions, energy use, cost'};
const CRIT=['Innovation','Technical feasibility','Cost','Security','Scalability','Team','Impact'];
const STAGES=['Posted','Matched','Evaluation','Pilot','Verified','Decision'];
const seed=()=>({view:'home',sel:null,ch:[{id:1001,title:'Logistics challenge: Reduce warehouse inspection delays',desc:'Warehouse inspections are slow and inconsistent. Reduce manual inspection time and errors using computer vision while preserving auditability and data security.',sec:'Logistics',target:25,days:60,budget:8,kpis:KPI.Logistics,stage:0,scores:{},short:[],pilot:null,dec:null,notified:[1,2,3],props:[]}],st:[
{id:1,name:'VisionAI',sec:['Logistics','Manufacturing'],tags:'computer vision warehouse goods inspection camera processing',min:4,pilots:7,won:6,imp:27,sec_ok:true,ready:'Enterprise-ready',gov:2,corp:4},
{id:2,name:'RoboFlow',sec:['Logistics','Manufacturing'],tags:'automation robotics logistics conveyor sorting warehouse',min:8,pilots:4,won:3,imp:22,sec_ok:true,ready:'Production',gov:0,corp:4},
{id:3,name:'TrackX',sec:['Logistics','Agriculture'],tags:'iot sensors monitoring tracking cold chain fleet',min:3,pilots:3,won:2,imp:18,sec_ok:false,ready:'MVP',gov:1,corp:2},
{id:4,name:'GovFlow',sec:['Government','Corporate'],tags:'workflow tender procurement approvals paperwork digitisation file',min:5,pilots:5,won:4,imp:33,sec_ok:true,ready:'Enterprise-ready',gov:4,corp:1},
{id:5,name:'MediQ',sec:['Healthcare'],tags:'queue appointment hospital patient triage scheduling wait',min:4,pilots:3,won:3,imp:29,sec_ok:true,ready:'Production',gov:1,corp:0},
{id:6,name:'KrishiSense',sec:['Agriculture','Sustainability'],tags:'crop yield soil drone irrigation farm wastage',min:2,pilots:2,won:1,imp:15,sec_ok:false,ready:'MVP',gov:1,corp:0},
{id:7,name:'GreenGrid',sec:['Sustainability','Manufacturing','Corporate'],tags:'energy emissions carbon power optimisation efficiency',min:6,pilots:4,won:3,imp:21,sec_ok:true,ready:'Production',gov:1,corp:2}]});
let S;try{S=JSON.parse(localStorage.getItem('innovex1'))}catch(e){}if(!S||!S.st)S=seed();
let DB=null,applying=false,lastV=0,syncReady=false,syncTimer=null,syncBusy=false,syncPending=false;
const syncBadge=()=>{const w=$('who');if(w&&S&&S.user)w.innerHTML=esc(S.user.name)+' · '+S.user.role+(syncReady?' · 🟢 database synced':' · 🟠 local / syncing')+' <button class="btn alt" onclick="logout()">Switch</button>'};
const syncWorkspace=async()=>{if(syncBusy){syncPending=true;return}syncBusy=true;try{const r=await fetch('/api/demo/state',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({ch:S.ch,st:S.st,v:lastV})});if(!r.ok)throw new Error('HTTP '+r.status);await r.json();syncReady=true;syncBadge()}catch(e){syncReady=false;syncBadge()}finally{syncBusy=false;if(syncPending){syncPending=false;syncWorkspace()}}};
const save=()=>{if(!applying){lastV=Date.now();S.lv=lastV}try{localStorage.setItem('innovex1',JSON.stringify(S))}catch(e){}if(!applying){clearTimeout(syncTimer);syncTimer=setTimeout(syncWorkspace,250)}};
async function bootWorkspace(){try{const r=await fetch('/api/demo/state');if(!r.ok)throw new Error('HTTP '+r.status);const d=await r.json();if(d.state&&Array.isArray(d.state.ch)&&Array.isArray(d.state.st)){S.ch=d.state.ch;S.st=d.state.st;lastV=Number(d.version)||Date.now();S.lv=lastV;try{localStorage.setItem('innovex1',JSON.stringify(S))}catch(e){}syncReady=true;}else{await syncWorkspace()}}catch(e){syncReady=false}render();syncBadge();}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id);const val=id=>$(id).value;
window.addEventListener('error',ev=>toast('Error: '+ev.message));
function toast(m){let e=$('toast');if(!e){e=document.createElement('div');e.id='toast';e.className='card';e.style.cssText='border:2px solid var(--warn);position:sticky;top:64px;z-index:9;font-weight:600';$('app').parentNode.insertBefore(e,$('app'))}e.textContent=m;e.style.display='block';try{e.scrollIntoView({block:'center'})}catch(x){}clearTimeout(window._tt);window._tt=setTimeout(()=>e.style.display='none',8000)}
function resetAll(){if(window._rc){window._rc=0;S=seed();save();render();toast('Demo data reset')}else{window._rc=1;toast('Click "Reset demo" again to confirm');setTimeout(()=>window._rc=0,4000)}}
function go(v,id){const tt=$('toast');if(tt)tt.style.display='none';S.view=v;S.sel=id??null;save();render()}
function words(t){return String(t).toLowerCase().match(/[a-z]{3,}/g)||[]}
/* ---------- AI engines (transparent heuristic) ---------- */
function match(c){const dw=new Set(words(c.title+' '+c.desc));
return S.st.map(s=>{const reasons=[];let sc=0;
if(s.sec.includes(c.sec)){sc+=35;reasons.push('Same industry ('+c.sec+')')}
const tw=words(s.tags),hit=[...new Set(tw.filter(w=>dw.has(w)))];
if(hit.length){sc+=Math.min(30,hit.length*10);reasons.push('Technology overlap: '+hit.join(', '))}
if(s.min<=c.budget){sc+=15;reasons.push('Within budget (min ₹'+s.min+'L)')}else reasons.push('Above budget (min ₹'+s.min+'L)');
if(s.pilots){const r=s.won/s.pilots;sc+=Math.round(r*12);reasons.push('Pilot record: '+s.won+'/'+s.pilots+' successful')}
if(s.sec_ok){sc+=8;reasons.push('Security verified')}
return{s,score:Math.min(99,sc),reasons}}).sort((a,b)=>b.score-a.score)}
function risks(c,s){const r=[];if(!s.sec_ok)r.push('Security not verified — cybersecurity risk');
if(s.min>c.budget)r.push('Minimum cost exceeds budget — financial risk');
if(s.ready==='MVP')r.push('MVP-stage product — implementation risk');
if(s.pilots<3)r.push('Few validated pilots — claims lightly evidenced');
if(!s.sec.includes(c.sec))r.push('Outside core sector — integration risk');
if(s.imp>30)r.push('High claimed impact — verify against baseline');return r}
function total(c,id){const sc=(c.scores&&c.scores[id])||{};let t=0;CRIT.forEach(k=>t+=+(sc[k]||5));return Math.round(t/CRIT.length*10)}
function result(c){const p=c.pilot,imp=p.base?(p.base-p.act)/p.base*100:0;
const sav=p.annual*imp/100,roi=p.cost?(sav-p.cost)/p.cost*100:0;
let rec='STOP';if(imp>=c.target&&p.sat>=70&&p.inc<=2)rec='SCALE';else if(imp>=c.target*.8)rec='EXTEND';else if(imp>=c.target*.4)rec='MODIFY';
return{imp,sav,roi,rec}}
/* ---------- views ---------- */
const ROLES={Organization:['home','challenges','new','graph'],Evaluator:['home','challenges','graph'],Startup:['home','challenges','startups','graph'],Admin:['home','challenges','new','startups','graph']};
const can=a=>S.user&&(S.user.role==='Admin'||a.includes(S.user.role));
function login(){$('nav').innerHTML='';$('app').innerHTML=`<div class="card" style="max-width:420px;margin:30px auto"><h2>Sign in to INNOVEX</h2><label>Name</label><input id="l_n" placeholder="Your name / organization"><label>Role</label><select id="l_r"><option>Organization</option><option>Evaluator</option><option>Startup</option><option>Admin</option></select><label>If Startup: which company are you?</label><select id="l_s">${S.st.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select><p class="mut">Organization posts problems and approves decisions; Evaluator scores proposals; Startup runs pilots and keeps its passport; Admin sees everything. Synthetic-data demo login. Changes sync to the local server database; role switching is for testing, not production authentication.</p><button class="btn" onclick="doLogin()">Enter</button></div>`}
Object.assign(ROLES,{Organization:['home','challenges','new','ledger','radar','graph'],Evaluator:['home','challenges','ledger','graph'],Startup:['home','challenges','startups','radar'],Admin:['home','challenges','new','startups','graph','ledger','radar']});
const LBL={Organization:{challenges:'My Challenges'},Evaluator:{challenges:'Evaluations',ledger:'Validations & Ledger'},Startup:{challenges:'Open Challenges',startups:'My Passport'}};
const CL=()=>{const u=S.user;if(u.role==='Startup')return S.ch.filter(c=>!c.dec).sort((a,b)=>b.id-a.id);if(u.role==='Organization')return S.ch.filter(c=>!c.owner||c.owner===u.name).sort((a,b)=>b.id-a.id);if(u.role==='Evaluator')return S.ch.filter(c=>!c.dec).sort((a,b)=>b.id-a.id);return S.ch.filter(c=>!c.dec||c.dec).sort((a,b)=>b.id-a.id)};
function doLogin(){S.user={name:val('l_n').trim()||'Guest',role:val('l_r'),sid:+val('l_s')};S.view='home';save();render()}
function logout(){S.user=null;save();render()}
function render(){$('who').innerHTML=S.user?esc(S.user.name)+' · '+S.user.role+(syncReady?' · 🟢 database synced':' · 🟠 local / syncing')+' <button class="btn alt" onclick="logout()">Switch</button>':'';if(!S.user){login();return}
const tabs=[['home','Dashboard'],['challenges','Challenges'],['new','Post Problem'],['startups','Startups'],['graph','Solution Graph'],['ledger','Impact Ledger'],['radar','Innovation Radar']].filter(t=>ROLES[S.user.role].includes(t[0])).map(t=>[t[0],(LBL[S.user.role]||{})[t[0]]||t[1]]);
$('nav').innerHTML=tabs.map(t=>`<button class="${S.view==t[0]||(S.view=='detail'&&t[0]=='challenges')?'on':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('');
({home,challenges,new:newV,startups,detail,graph,ledger,radar})[S.view]();window.scrollTo(0,0)}
const crow=(c,x,b)=>`<div class="card"><div class="row"><div><b>${esc(c.title)}</b><br><span class="mut">${c.dec?'Decision: '+c.dec.d:STAGES[c.stage]} • −${c.target}% • ₹${c.budget}L${x?' • '+x:''}</span></div><button class="btn" onclick="go('detail',${c.id})">${b||'Open'}</button></div></div>`;
const kpi=(l,v,k)=>`<div class="card"><div class="mut">${l}</div><div class="big ${k||''}">${v}</div></div>`;
const lst=(t,a,f,e)=>`<h3 style="margin-top:14px">${t}</h3>`+(a.length?a.map(f).join(''):`<div class="card mut">${e}</div>`);
function home(){const u=S.user,r=u.role;if(r==='Admin')return homeAdmin();let h=`<h2>${esc(u.name)} — ${r} dashboard</h2>`;
if(r==='Organization'){const M=S.ch.filter(c=>!c.owner||c.owner===u.name),act=c=>c.dec?((['SCALE','EXTEND'].includes(c.dec.d)&&!c.proc)?'Approve procurement':null):['Run AI matching','Review proposals & shortlist','Approve startup for pilot',null,'Take final decision'][c.stage]||null,A=M.filter(act);
h+=`<div class="grid">${kpi('My challenges',M.length)}${kpi('Need my action',A.length,A.length?'warn':'')}${kpi('Proposals received',M.reduce((a,c)=>a+(c.props||[]).length,0))}${kpi('Scaled solutions',M.filter(c=>c.dec&&c.dec.d==='SCALE').length,'ok')}</div>`;
h+=lst('Action needed',A,c=>crow(c,'<b class="warn">'+act(c)+'</b>'),'Nothing waiting on you.')+lst('All my challenges',M,c=>crow(c),'No problems posted yet.')+`<p><button class="btn" onclick="go('new')">Post a new problem</button></p>`}
else if(r==='Startup'){const s=S.st.find(x=>x.id===u.sid);if(!s){S.user=null;render();return}
const open=S.ch.filter(c=>!c.dec).map(c=>({c,m:(match(c).find(x=>x.s.id===s.id)||{score:0}).score})).sort((a,b)=>b.m-a.m),mine=S.ch.filter(c=>(c.props||[]).some(p=>p.sid===s.id)),todo=S.ch.filter(c=>c.win===s.id&&c.stage===3);
h+=`<div class="card"><div class="row"><b>${esc(s.name)} — Innovation Passport</b><span class="tag">${s.ready}</span></div><div class="grid">${kpi('Avg impact',s.imp+'%','ok')}${kpi('Verified pilots',s.pilots)}${kpi('Successful',s.won)}${kpi('Independent validations',s.ind||0)}</div><span class="mut">Security: ${s.sec_ok?'✔ Verified':'✘ Pending'} • Gov ${s.gov} • Corporate ${s.corp}</span></div>`;
h+=lst('Pilots awaiting your data',todo,c=>crow(c,'<b class="warn">Submit pilot evidence</b>'),'No active pilots.')+lst('Open challenges available to you',open,x=>crow(x.c,x.m+'% match'+((x.c.props||[]).some(p=>p.sid===s.id)?' • proposal sent':''),(x.c.props||[]).some(p=>p.sid===s.id)?'View':'Submit proposal'),'No open challenges match yet.')+lst('My proposals',mine,c=>crow(c,c.win===s.id?'<b class="ok">Selected for pilot</b>':c.stage>=3?'Not selected':'Under review'),'You have not submitted any proposals.')}
else{const E=S.ch.filter(c=>!c.dec),V=S.ch.filter(c=>c.pilot&&!c.val),D=S.ch.filter(c=>c.val&&c.val.by===u.name);
h+=`<div class="grid">${kpi('To evaluate',E.length,E.length?'warn':'')}${kpi('To validate',V.length,V.length?'warn':'')}${kpi('Validated by me',D.length,'ok')}</div>`+lst('Challenges available for evaluation',E,c=>crow(c,c.stage===2?(c.short||[]).length+' shortlisted':STAGES[c.stage],c.stage===2?'Evaluate':'Open'),'No challenges available.')+lst('Pilots awaiting independent validation',V,c=>crow(c,'<b class="warn">Re-measure result</b>'),'No validations pending.')}
$('app').innerHTML=h}
function homeAdmin(){const bySec={};S.ch.forEach(c=>bySec[c.sec]=(bySec[c.sec]||0)+1);const mx=Math.max(1,...Object.values(bySec));
const ver=S.ch.filter(c=>c.stage>=5&&c.dec);const fails=S.ch.filter(c=>c.dec&&c.dec.d==='STOP');
$('app').innerHTML=`<h2>Where organizations discover innovation, test it, prove it and scale what works.</h2>
<div class="grid"><div class="card"><div class="mut">Active challenges</div><div class="big">${S.ch.filter(c=>!c.dec).length}</div></div>
<div class="card"><div class="mut">Verified startups</div><div class="big">${S.st.length}</div></div>
<div class="card"><div class="mut">Decisions made</div><div class="big">${ver.length}</div></div>
<div class="card"><div class="mut">Scaled solutions</div><div class="big ok">${ver.filter(c=>c.dec.d==='SCALE').length}</div></div></div>
<div class="grid"><div class="card"><h3>Problem Heatmap</h3>${S.ch.length?Object.entries(bySec).map(([k,v])=>`<div class="mut">${k} (${v})</div><div class="bar"><i style="width:${v/mx*100}%"></i></div>`).join(''):'<p class="mut">No problems posted yet.</p>'}</div>
<div class="card"><h3>Failure Vault</h3>${fails.length?fails.map(c=>`<p><b>${esc(c.title)}</b><br><span class="mut">${esc(c.dec.note||'Stopped')}</span></p>`).join(''):'<p class="mut">Failed pilots and why they failed appear here.</p>'}</div></div>
<div class="card"><h3>Start</h3><p class="mut">Pick a sector to post a problem:</p>${SECT.map(s=>`<button class="tag" style="cursor:pointer" onclick="newFor('${s}')">${s}</button>`).join('')}
<p><button class="btn" onclick="go('new')">Post a problem</button></p></div>`}
let pre='Government';function newFor(s){pre=s;go('new')}
function newV(){$('app').innerHTML=`<h2>Post a problem</h2>${chatCard()}<div class="card"><label>Sector</label><select id="n_sec">${SECT.map(s=>`<option ${s==pre?'selected':''}>${s}</option>`).join('')}</select>
<label>Describe the problem in plain words</label><textarea id="n_d" rows="4" placeholder="Our warehouses are taking too long to process incoming goods. Reduce processing time by 25%."></textarea>
<div class="grid"><div><label>Budget (₹ lakh)</label><input id="n_b" type="number" value="8"></div><div><label>Pilot days</label><input id="n_days" type="number" value="60"></div><div><label>Target improvement % (blank = auto)</label><input id="n_t" type="number"></div></div>
<button class="btn" onclick="postCh()">Run Challenge Copilot &amp; post</button> <button class="btn alt" onclick="$('n_d').value='Our warehouses are taking too long to process incoming goods. Reduce processing time by 25%.'">Use example</button></div>`}
async function postCh(){try{await postCh2()}catch(e){toast('Could not post: '+e.message)}}
async function postCh2(){const d=val('n_d').trim();if(d.length<10){toast('Please describe the problem (10+ characters).');return}
const sec=val('n_sec'),m=d.match(/(\d{1,2})\s*%/);const target=+val('n_t')||(m?+m[1]:25);
const w=d.replace(/[^\w\s]/g,'').split(/\s+/).slice(0,7).join(' ');
let c={id:Date.now(),title:sec+' challenge: '+w,desc:d,sec,target,days:+val('n_days')||60,budget:+val('n_b')||5,kpis:KPI[sec],stage:0,scores:{},short:[],pilot:null,dec:null};
c.notified=match(c).filter(m=>m.score>=50).slice(0,5).map(m=>m.s.id);c.props=[];c.owner=S.user.name;CHAT=[];CHREADY=false;
if(window.createChallenge){c=await window.createChallenge(c)}
S.ch=[c,...S.ch.filter(x=>x.id!==c.id)];save();go('detail',c.id)}
function challenges(){$('app').innerHTML=`<h2>Challenges</h2>`+(CL().length?CL().map(c=>`<div class="card"><div class="row"><div><b>${esc(c.title)}</b><br><span class="mut">Target −${c.target}% • ${c.days} days • ₹${c.budget}L</span></div><div><span class="tag">${c.dec?'Decision: '+c.dec.d:STAGES[c.stage]}</span>${(S.user.role==='Startup'&&(c.notified||[]).includes(S.user.sid))?'<span class="tag ok">Matched to you</span>':''} <button class="btn" onclick="go('detail',${c.id})">Open</button></div></div></div>`).join(''):'<div class="card mut">Nothing here yet. Post your first problem.</div>')}
function startups(){$('app').innerHTML=`<h2>Innovation Passports</h2><div class="grid">${S.st.filter(s=>S.user.role!=='Startup'||s.id===S.user.sid).map(s=>`<div class="card"><div class="row"><b>${esc(s.name)}</b><span class="tag">${s.ready}</span></div>
<div>${s.sec.map(x=>`<span class="tag">${x}</span>`).join('')}</div><div class="big ok">${s.imp}%</div><div class="mut">avg measured impact</div>

async function translateForChat(text,from,to){
  if(!text||from===to)return text;
  try{
    if(window.innovexApi){
      const d=await window.innovexApi('/translate',{method:'POST',body:JSON.stringify({text,from,to})});
      if(d&&d.translatedText)return d.translatedText;

  return text;
}
function extractChatFields(text){
  const x=text.toLowerCase();
  const out={sector:null,problem_en:text,target:null,budget_lakh:null,days:null};
  const km=[['Healthcare',/hospital|patient|opd|clinic|medical|healthcare|health/],['Agriculture',/farm|crop|kisan|agri|agriculture|mandi|irrigation/],['Logistics',/warehouse|logistic|transport|delivery|godown|fleet|supply chain/],['Manufacturing',/factory|manufactur|production|machine|plant|assembly/],['University',/college|student|university|school|campus|education/],['Sustainability',/energy|emission|waste|water|carbon|sustainab/],['Government',/department|tender|govt|government|citizen|public service/],['Corporate',/company|business|corporate|office|enterprise/]];
  const hit=km.find(k=>k[1].test(x)); if(hit)out.sector=hit[0];
  const tm=x.match(/(?:reduce|improve|increase|target|by)\D{0,12}(\d+(?:\.\d+)?)\s*%/); if(tm)out.target=+tm[1];
  const bm=x.match(/(?:₹|rs\.?|inr)\s*(\d+(?:\.\d+)?)\s*(?:lakh|lac|l)?/i); if(bm)out.budget_lakh=+bm[1];
  const dm=x.match(/(\d+)\s*(?:day|days|day pilot)/i); if(dm)out.days=+dm[1];
  return out;
}
